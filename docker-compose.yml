services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: hoppr-server
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
    networks:
      hoppr_network: {}
      web_network:
        aliases:
          - hoppr-server
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: hoppr-web
    environment:
      NODE_ENV: production
    ports:
      - "8080:80"
    networks:
      hoppr_network: {}
      web_network:
        aliases:
          - hoppr-web
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  hoppr_network:
    driver: bridge
    name: hoppr_network
  web_network:
    external: true
    name: mkserver-shared
